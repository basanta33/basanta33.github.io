name: Deploy Next.js Site

on:
  push:
    branches: ["main", "master"]
    paths:
      - "nextjs-migration/**"
      - ".github/workflows/deploy-next-submodule.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-next-migration"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with submodules)
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nextjs-migration/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: nextjs-migration

      - name: Lint
        run: npm run lint
        working-directory: nextjs-migration

      - name: Build static export
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run build
        working-directory: nextjs-migration

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nextjs-migration/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
